[workspace]
members = ["i2c/verify", "riscv/verify"]
default-members = ["riscv/verify"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
celox = { git = "https://github.com/celox-sim/celox.git", rev = "330eb5797fbe53537125f5cfdbcde5d9cc723a6e" }
celox03 = { package = "celox", version = "=0.3.1" }
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "4ea4a1375fe8ee077c5fcb5ffdd80b7a5a0de7b3" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "4ea4a1375fe8ee077c5fcb5ffdd80b7a5a0de7b3" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "4ea4a1375fe8ee077c5fcb5ffdd80b7a5a0de7b3" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "4ea4a1375fe8ee077c5fcb5ffdd80b7a5a0de7b3" }
texo-cli = { git = "https://github.com/fabrica-eda/texo.git", rev = "b452fb7ac60c22a43a9f1dc40b0d17e94c9e258f" }
texo-struo = { git = "https://github.com/fabrica-eda/texo.git", rev = "b452fb7ac60c22a43a9f1dc40b0d17e94c9e258f" }

[profile.release]
lto = "thin"
codegen-units = 1
