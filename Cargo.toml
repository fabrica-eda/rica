[workspace]
members = ["i2c/verify", "riscv/verify"]
default-members = ["riscv/verify"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
# Shared-clock FF correctness and SplitCoalescedStores access-order fix (PR #762).
celox = { git = "https://github.com/celox-sim/celox.git", rev = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "4e9de737d1ad0b1e619d8887505a6ba0ad13c74b" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "4e9de737d1ad0b1e619d8887505a6ba0ad13c74b" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "4e9de737d1ad0b1e619d8887505a6ba0ad13c74b" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "4e9de737d1ad0b1e619d8887505a6ba0ad13c74b" }
texo-cli = { git = "https://github.com/fabrica-eda/texo.git", rev = "6baf4626b17d6373c973755336460c9bc32ed458" }
texo-struo = { git = "https://github.com/fabrica-eda/texo.git", rev = "6baf4626b17d6373c973755336460c9bc32ed458" }

[profile.release]
lto = "thin"
codegen-units = 1
