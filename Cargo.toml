[workspace]
members = ["i2c/verify", "riscv/verify", "toolchain/tb"]
default-members = ["riscv/verify", "toolchain/tb"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
# Celox 0.4.7 after the release tag, including upstream parameter typing fix #787.
celox = { version = "=0.4.7", git = "https://github.com/celox-sim/celox.git", rev = "ab63d6cf16ce702be7feed1c197808c30aad690d" }
# Keep direct and Texo-transitive dependencies aligned (Struo #91 / Texo #73).
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "70058b6f6af4de25c7b075802692f371c914c01f" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "70058b6f6af4de25c7b075802692f371c914c01f" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "70058b6f6af4de25c7b075802692f371c914c01f" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "70058b6f6af4de25c7b075802692f371c914c01f" }
texo-cli = { git = "https://github.com/fabrica-eda/texo.git", rev = "c48afcd6485055b868321904d5d780f1a14412c7" }
texo-struo = { git = "https://github.com/fabrica-eda/texo.git", rev = "c48afcd6485055b868321904d5d780f1a14412c7" }

[patch.crates-io]
# Keep constant-folding metadata consistent with fitted constant storage.
veryl-analyzer = { path = "toolchain/vendor/veryl-const-value/veryl-analyzer" }

[profile.release]
lto = "thin"
codegen-units = 1
