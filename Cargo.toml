[workspace]
members = ["i2c/verify", "riscv/verify"]
default-members = ["riscv/verify"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
celox = { git = "https://github.com/celox-sim/celox.git", rev = "7bb38a0ce4d66f349d499b270d27375d7c1a01bb" }
celox03 = { package = "celox", version = "=0.3.1" }
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "7a7769b9fc757ead82e0b797f496edf83f521126" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "7a7769b9fc757ead82e0b797f496edf83f521126" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "7a7769b9fc757ead82e0b797f496edf83f521126" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "7a7769b9fc757ead82e0b797f496edf83f521126" }
texo-cli = { git = "https://github.com/fabrica-eda/texo.git", rev = "5c36aaf41644ef3bfe1562bf0b5a254e31899d4b" }
texo-struo = { git = "https://github.com/fabrica-eda/texo.git", rev = "5c36aaf41644ef3bfe1562bf0b5a254e31899d4b" }

[profile.release]
lto = "thin"
codegen-units = 1
