[workspace]
members = ["i2c/verify", "riscv/verify"]
default-members = ["riscv/verify"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
celox = { git = "https://github.com/celox-sim/celox.git", rev = "7bb38a0ce4d66f349d499b270d27375d7c1a01bb" }
celox03 = { package = "celox", version = "=0.3.1" }
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "68bf5432ec412357258e2c64ae6961cf9c306c45" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "68bf5432ec412357258e2c64ae6961cf9c306c45" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "68bf5432ec412357258e2c64ae6961cf9c306c45" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "68bf5432ec412357258e2c64ae6961cf9c306c45" }
texo-cli = { git = "https://github.com/fabrica-eda/texo.git", rev = "782d4cf62cb5db5902872dc4287530bae1151aab" }
texo-struo = { git = "https://github.com/fabrica-eda/texo.git", rev = "782d4cf62cb5db5902872dc4287530bae1151aab" }

[profile.release]
lto = "thin"
codegen-units = 1
