[workspace]
members = ["i2c/verify", "riscv/verify", "riscv/tools/jtag-sta", "toolchain/tb", "toolchain/texo"]
default-members = ["riscv/verify", "toolchain/tb"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
# Current simulator and compressed-artifact synthesis stack.
celox = "=0.8.1"
# Keep direct and Texo-transitive Struo dependencies aligned.
struo-celox = { git = "https://github.com/fabrica-eda/struo.git", rev = "a45b63962c843c0876506f2f9a6d560f5537b40d" }
struo-frontend-veryl = { git = "https://github.com/fabrica-eda/struo.git", rev = "a45b63962c843c0876506f2f9a6d560f5537b40d" }
struo-synth = { git = "https://github.com/fabrica-eda/struo.git", rev = "a45b63962c843c0876506f2f9a6d560f5537b40d" }
struo-target-ecp5 = { git = "https://github.com/fabrica-eda/struo.git", rev = "a45b63962c843c0876506f2f9a6d560f5537b40d" }
texo-cli = { git = "https://github.com/fabrica-eda/texo.git", rev = "97b2b0490a2d200d60e3265f1fd46069c6a6dbb9" }
texo-model = { git = "https://github.com/fabrica-eda/texo.git", rev = "97b2b0490a2d200d60e3265f1fd46069c6a6dbb9" }
texo-struo = { git = "https://github.com/fabrica-eda/texo.git", rev = "97b2b0490a2d200d60e3265f1fd46069c6a6dbb9" }
texo-target-ecp5 = { git = "https://github.com/fabrica-eda/texo.git", rev = "97b2b0490a2d200d60e3265f1fd46069c6a6dbb9" }
texo-timing = { git = "https://github.com/fabrica-eda/texo.git", rev = "97b2b0490a2d200d60e3265f1fd46069c6a6dbb9" }

[patch.crates-io]
# Keep constant-folding metadata consistent with fitted constant storage.
veryl-analyzer = { path = "toolchain/vendor/veryl-const-value/veryl-analyzer" }

[profile.release]
lto = "thin"
codegen-units = 1
