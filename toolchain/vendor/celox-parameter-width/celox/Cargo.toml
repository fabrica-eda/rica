[package]
name                  = "celox"
version = "0.4.6"
publish               = ["crates-io"]
authors = ["tignear"]
repository = "https://github.com/celox-sim/celox"
license = "MIT OR Apache-2.0"
description = "Celox HDL Simulator"
readme                = "README.md"
edition = "2024"
rust-version = "1.98.1"

[features]
default = ["host-runtime"]
host-runtime = [
    "dep:celox-backend-cranelift",
    "dep:celox-backend-x86",
    "dep:celox-macros",
    "dep:wasmtime",
    "dep:veryl-component-sys",
    "dep:libloading",
    "rand/thread_rng",
    "celox-sir-opt/timing",
]
systemverilog = ["dep:celox-frontend-sv"]
arm64-codegen = ["host-runtime", "dep:celox-backend-arm64"]
x86_64-codegen = [
    "host-runtime",
    "dep:celox-backend-x86",
    "celox-backend-x86/cross-codegen",
]

[dependencies]
toml = { "version" = "1.0.3" }
veryl-analyzer = { "version" = "0.21.0" }
veryl-metadata = { "version" = "0.21.0" }
veryl-parser = { "version" = "0.21.0", "default-features" = false }
veryl-path = { "version" = "0.21.0" }
veryl-component-sys   = { version = "0.1.1", optional = true }
libloading            = { version = "0.9", optional = true }
celox-analysis = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-backend-wasm = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-design = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-frontend-core = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-frontend-sdk = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-frontend-sv = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9", "optional" = true }
celox-frontend-veryl = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-sir = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-sir-opt = { "version" = "=0.4.6", "default-features" = false, "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-slt = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-state-layout = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-runtime = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
celox-testbench = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }
fxhash = { "version" = "0.2.1" }
thiserror = { "version" = "2.0" }
clap = { "version" = "4.5.60", "features" = ["derive"] }
miette = { "version" = "7.6" }
num-bigint            = "0.5"
rand = { "version" = "0.10", "default-features" = false }
rand_pcg = { "version" = "0.10" }
serde = { "version" = "1.0", "features" = ["derive"] }
serde_json = { "version" = "1.0" }
postcard              = { version = "1.1", features = ["alloc"] }
num-traits = { "version" = "0.2.19" }
bit-set = { "version" = "0.11" }
itertools = { "version" = "0.15.0" }
tracing = { "version" = "0.1" }
celox-macros = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9", "optional" = true }
celox-backend-cranelift = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9", "optional" = true }
celox-backend-arm64 = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9", "optional" = true }
wasmtime              = { version = "48", optional = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
celox-backend-x86 = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9", "optional" = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
celox-sir-opt = { "version" = "=0.4.6", "default-features" = false, "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9", "features" = ["wide-native-memory"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
celox-backend-arm64 = { "version" = "=0.4.6", "git" = "https://github.com/celox-sim/celox.git", "rev" = "7ff0dd2b8c4a92efd9a1aabe376240c6dff3f9c9" }

[dev-dependencies]
insta      = "1.46"
libc = "0.2"
criterion  = "0.8"
codspeed-criterion-compat = "5.0.1"
proptest   = "1.10"
test-case  = "3"
tempfile = "3.26"
veryl-std = { "version" = "0.21.0" }
veryl-emitter = { "version" = "0.21.0" }
veryl-simulator = { "version" = "0.21.0" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { "level" = "deny", "priority" = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
