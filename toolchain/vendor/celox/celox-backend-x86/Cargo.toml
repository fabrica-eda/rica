[package]
name = "celox-backend-x86"
version = "0.4.5"
publish = ["crates-io"]
authors = ["tignear"]
repository = "https://github.com/celox-sim/celox"
license = "MIT OR Apache-2.0"
description = "Celox x86-64 machine-code backend"
edition = "2024"
rust-version = "1.98.0"

[features]
default = []
cross-codegen = []

[dependencies]
tracing = "0.1"
celox-analysis = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-backend-common = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-design = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-sir = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-state-layout = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
fxhash = "0.2.1"
libc = "0.2"
memmap2 = "0.9"
num-bigint = { version = "0.5", features = ["serde"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "encoder", "block_encoder", "decoder", "nasm", "op_code_info", "code_asm"] }

[dev-dependencies]
celox-sir-opt = { version = "=0.4.5", default-features = false, git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
