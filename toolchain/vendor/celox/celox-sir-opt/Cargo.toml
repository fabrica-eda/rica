[package]
name = "celox-sir-opt"
version = "0.4.5"
publish = ["crates-io"]
authors = ["tignear"]
repository = "https://github.com/celox-sim/celox"
license = "MIT OR Apache-2.0"
description = "Backend-independent SIR optimization policy and passes for Celox"
edition = "2024"
rust-version = "1.98.0"

[features]
default = []
timing = []
wide-native-memory = []

[dependencies]
tracing = "0.1"
bit-set = "0.11"
celox-analysis = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-design = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-sir = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-state-layout = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
fxhash = "0.2.1"
itertools = "0.15.0"
num-bigint          = "0.5"
num-traits = "0.2.19"
thiserror = "2.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
