[package]
name = "celox-frontend-core"
version = "0.4.5"
publish = ["crates-io"]
authors = ["tignear"]
repository = "https://github.com/celox-sim/celox"
license = "MIT OR Apache-2.0"
description = "Source-neutral symbolic frontend core for Celox"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
celox-design = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-frontend-sdk = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-sir = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
celox-slt = { version = "=0.4.5", git = "https://github.com/celox-sim/celox.git", rev = "9aa2457811b3ef2b002e90d2ae4f5aafb0195099" }
fxhash = "0.2.1"
miette = { version = "7.6" }
num-bigint = { version = "0.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
